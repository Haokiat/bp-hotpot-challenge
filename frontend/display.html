<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hot Pot Challenge — Live Leaderboard</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  /* ============================================================
     DISPLAY SCREEN (projector) — full poster style.
     Sized for 1920×1080; scales down without losing legibility.
     ============================================================ */

  html, body { height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(900px 620px at 12% -8%, rgba(245, 197, 24, 0.20), transparent 62%),
      radial-gradient(820px 560px at 92% 4%, rgba(79, 168, 216, 0.16), transparent 60%),
      radial-gradient(760px 700px at 78% 104%, rgba(74, 155, 78, 0.18), transparent 62%),
      radial-gradient(680px 520px at 4% 96%, rgba(232, 84, 122, 0.13), transparent 60%),
      var(--cream);
  }

  /* --- decorative tropical leaves, poster corners ---------------------- */
  .leaf { position: fixed; pointer-events: none; opacity: 0.5; z-index: 0; }
  .leaf-tr { top: -70px; right: -60px; width: 340px; transform: rotate(18deg); }
  .leaf-bl { bottom: -90px; left: -70px; width: 380px; transform: rotate(-160deg); }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .confetti span {
    position: absolute;
    display: block;
    border-radius: 2px;
    opacity: 0.55;
    animation: drift 7s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(var(--rot)); }
    to   { transform: translateY(-14px) rotate(calc(var(--rot) + 12deg)); }
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--s4);
    padding: var(--s5) var(--s6) var(--s5);
  }

  /* --- brush-stroke ribbon banner (the poster's signature) -------------- */
  .ribbon { position: relative; display: block; filter: drop-shadow(0 6px 14px rgba(27,58,107,.22)); }
  /* Direct child only — this sizes the painted background shape. Without the
     `>` it also caught the icon nested inside .ribbon-label and stretched it
     to the full width of the banner. */
  .ribbon > svg { display: block; width: 100%; height: auto; }
  /* The painted path leaves a transparent margin inside the viewBox, so the
     label is inset to the actual ink rather than the full box. */
  .ribbon-icon { width: 1.35em; height: 1.35em; display: block; flex: none; }
  .tie-trophy { width: 1.2em; height: 1.2em; vertical-align: -0.22em; display: inline-block; }

  .ribbon-label {
    position: absolute; inset: 12% 6%;
    display: flex; align-items: center; justify-content: center;
    gap: var(--s4);
    color: #fff;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  header.masthead { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--s5); }
  .masthead h1 { font-size: clamp(26px, 2.6vw, 44px); font-weight: 800; line-height: 1.02; }
  .masthead .kicker {
    font-family: var(--font-body);
    font-weight: 900;
    font-size: clamp(11px, 0.85vw, 15px);
    letter-spacing: 0.22em;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* live status pill */
  .status {
    display: inline-flex; align-items: center; gap: var(--s2);
    padding: var(--s2) var(--s4);
    border-radius: var(--r-pill);
    background: var(--paper);
    border: 2px solid rgba(27, 58, 107, 0.12);
    box-shadow: var(--lift-1);
    font-weight: 800; font-size: 14px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--navy);
    white-space: nowrap;
  }
  .status .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(74, 155, 78, 0.18);
  }
  .status[data-state="reconnecting"] .dot,
  .status[data-state="polling"] .dot { background: var(--orange); box-shadow: 0 0 0 4px rgba(245,130,31,.2); animation: pulse 1.1s ease-in-out infinite; }
  .status[data-state="offline"] .dot { background: var(--coral); box-shadow: 0 0 0 4px rgba(232,84,122,.2); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* --- main split: pot on the left, leaderboard on the right ----------- */
  .split { display: grid; grid-template-columns: 1fr clamp(420px, 30%, 570px); gap: var(--s5); min-height: 0; }

  /* The pot column is a single stage. The score card floats ON the pot rather
     than stacking above it, so none of the column's height goes to anything
     but the pot itself. */
  .pot-col { position: relative; min-height: 0; overflow: hidden; }

  /* total score card — floats over the top-left of the pot */
  .totals {
    position: absolute; z-index: 3; top: 0; left: 0;
    background: rgba(255, 250, 240, 0.93);
    backdrop-filter: blur(6px);
    border: 3px solid rgba(74, 155, 78, 0.30);
    border-radius: var(--r-lg);
    box-shadow: var(--lift-3);
    padding: var(--s3) var(--s5) var(--s4);
    text-align: center;
    min-width: 260px;
  }
  .totals .label {
    font-weight: 900; font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--green-deep); opacity: 0.85;
  }
  /* The team name is the point of this card now, so it gets display type. */
  .totals .team {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(20px, 1.9vw, 32px); line-height: 1.06;
    letter-spacing: -0.02em; color: var(--navy);
    margin-top: 2px;
    max-width: 15ch;
    overflow-wrap: anywhere;
  }
  /* Idle: before the admin has picked anyone, don't show a fake 0. */
  .totals[data-idle="1"] .team { font-size: clamp(15px, 1.3vw, 21px); color: var(--navy-soft); opacity: 0.75; }
  .totals[data-idle="1"] .value,
  .totals[data-idle="1"] .sub { display: none; }
  /* Border picks up the team's soup base, the only other place it shows. */
  .totals[data-soup] { border-color: var(--soup-tint, rgba(74, 155, 78, 0.30)); }
  .totals .value {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(56px, 6.6vw, 104px); line-height: 0.94;
    color: var(--navy); letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .totals .sub { font-weight: 700; font-size: 15px; color: var(--navy-soft); opacity: 0.75; }
  .totals.bump { animation: bump 380ms var(--spring); }
  @keyframes bump { 0% { transform: scale(1); } 42% { transform: scale(1.045); } 100% { transform: scale(1); } }

  /* floating "+15" on score */
  .plus {
    position: absolute; left: 50%; top: 34%;
    transform: translateX(-50%);
    font-family: var(--font-display); font-weight: 800; font-size: 40px;
    color: var(--green); pointer-events: none;
    text-shadow: 0 2px 0 #fff, 0 6px 16px rgba(74,155,78,.4);
    animation: floatUp 1000ms var(--ease-out) forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 12px) scale(0.7); }
    24%  { opacity: 1; transform: translate(-50%, -6px) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -76px) scale(1); }
  }

  /* --- the virtual hotpot ---------------------------------------------- */
  /* Pot is anchored to the bottom of the stage and sized past the available
     height on purpose: the base of the bowl bleeds off the lower edge so it
     reads as too big to contain. Roughly half the screen at 1920x1080. */
  .pot-wrap { position: absolute; inset: 0; display: grid; place-items: end center; min-height: 0; }
  .pot-art { position: relative; width: 100%; max-width: min(112%, 1240px); aspect-ratio: 1 / 0.92; margin-bottom: -8%; }
  .pot-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Soup base cross-fade. Only the liquid changes — the terracotta clay, rim
     and handles stay constant so the pot still reads as the poster's pot. */
  .pot-art stop, .pot-art .broth-rim { transition: stop-color 320ms var(--ease-out), stroke 320ms var(--ease-out); }
  .garnish-layer { pointer-events: none; }
  .pot-art .garnish { opacity: 0; transition: opacity 320ms var(--ease-out); pointer-events: none; }
  .pot-art[data-soup="mala"]   .g-mala,
  .pot-art[data-soup="tomato"] .g-tomato,
  .pot-art[data-soup="herbal"] .g-herbal,
  .pot-art[data-soup="laksa"]  .g-laksa { opacity: 1; }

  /* Mala is the fiery one — give it visibly more steam. */
  .pot-art[data-soup="mala"] .steam path { stroke-width: 9; opacity: 1; }
  .pot-art[data-soup="mala"] .steam { width: 58%; }

  /* ingredients live in a clipped basin above the pot rim */
  .basin {
    position: absolute;
    left: 13%; right: 13%; top: 30%; height: 22%;
    overflow: visible;
    border-radius: 50%;
  }
  /* Roughly 2x the old size — ingredients are the thing the crowd watches. */
  .bit {
    position: absolute;
    width: 12.5%;
    min-width: 36px;
    aspect-ratio: 1;
    filter: drop-shadow(0 4px 5px rgba(90, 40, 20, 0.38));
    will-change: transform;
  }
  .bit svg { display: block; width: 100%; height: 100%; }

  /* THE TOSS — total envelope 400ms, per PRD 6.6.
     Three nested elements because one element can only run one transform:
       .bit      → horizontal travel, LINEAR (constant sideways speed)
       .bit-arc  → vertical travel, ease-out up then ease-in down, + landing squash
       .bit-spin → rotation, settling onto the resting tilt
     X linear + Y eased = a real parabola. */
  .bit-arc, .bit-spin { width: 100%; height: 100%; will-change: transform; }
  .bit-spin { transform: rotate(var(--tilt, 0deg)); }

  .bit.tossing            { animation: tossX 300ms linear both; }
  .bit.tossing .bit-arc   { animation: tossY 300ms both; }
  .bit.tossing .bit-spin  { animation: tossSpin 300ms cubic-bezier(.25,.7,.4,1) both; }

  @keyframes tossX {
    from { transform: translateX(var(--from-x, -300px)); }
    to   { transform: translateX(0); }
  }
  /* Per-keyframe easing is what makes the arc read as thrown rather than lobbed. */
  @keyframes tossY {
    0%   { transform: translateY(var(--from-y, 70px)); animation-timing-function: cubic-bezier(.12,.62,.35,1); }
    46%  { transform: translateY(var(--peak, -240px)); animation-timing-function: cubic-bezier(.55,.03,.85,.45); }
    88%  { transform: translateY(5px) scale(1.14, .84); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes tossSpin {
    from { transform: rotate(var(--spin-from, -540deg)); }
    to   { transform: rotate(var(--tilt, 0deg)); }
  }

  /* Motion trail — 300ms at this speed is quick for the eye to follow. */
  .bit.tossing::after {
    content: '';
    position: absolute; inset: 8%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.5), transparent 70%);
    animation: trail 300ms ease-out both;
    pointer-events: none;
  }
  @keyframes trail {
    0%, 12% { opacity: 0; transform: scale(.5); }
    45%     { opacity: .55; transform: scale(1.5) translateX(14px); }
    100%    { opacity: 0; transform: scale(.7); }
  }

  /* Splash — starts at 260ms (overlapping the flight tail) and ends at 400ms,
     so the whole toss stays inside the PRD's budget. */
  .splash { position: absolute; pointer-events: none; width: 0; height: 0; }
  .splash .ring {
    position: absolute; left: -34px; top: -14px; width: 68px; height: 28px;
    border: 3px solid rgba(255, 255, 255, 0.75);
    border-radius: 50%;
    animation: ripple 140ms 260ms ease-out both;
  }
  @keyframes ripple {
    from { transform: scale(.35); opacity: .95; }
    to   { transform: scale(1.9); opacity: 0; }
  }
  .splash i {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--droplet, rgba(255, 245, 230, .95));
    animation: droplet 140ms 260ms ease-out both;
  }
  @keyframes droplet {
    from { transform: translate(0, 0) scale(1); opacity: .95; }
    to   { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }

  /* steam */
  .steam { position: absolute; left: 50%; top: 6%; width: 46%; transform: translateX(-50%); pointer-events: none; }
  .steam path {
    fill: none; stroke: var(--steam, rgba(27, 58, 107, 0.16));
    stroke-width: 7; stroke-linecap: round;
    transition: stroke 320ms var(--ease-out);
  }
  .steam path:nth-child(1) { animation: waft 3.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation: waft 4.1s ease-in-out infinite 0.5s; }
  .steam path:nth-child(3) { animation: waft 3.8s ease-in-out infinite 1.1s; }
  @keyframes waft { 0%,100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 0.6; transform: translateY(-9px); } }


  /* --- leaderboard ------------------------------------------------------ */
  .board-col {
    display: grid; grid-template-rows: auto 1fr auto; gap: var(--s3);
    min-height: 0; position: relative;
  }

  /* Single column, exactly 8 rows in view, the rest reached by scrolling.
     --row-h is measured in JS so 8 rows land flush against the column height
     at any screen size. */
  .board {
    display: grid;
    gap: var(--s3);
    grid-template-columns: 1fr;
    grid-auto-rows: var(--row-h, 96px);
    align-content: start;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: rgba(74,155,78,.55) transparent;
    padding-right: var(--s2);
  }
  .board::-webkit-scrollbar { width: 8px; }
  .board::-webkit-scrollbar-thumb { background: rgba(74,155,78,.55); border-radius: 99px; }
  .board::-webkit-scrollbar-track { background: transparent; }

  /* Fade at the lower edge so the crowd can see the list continues. */
  .board-col::after {
    content: '';
    /* Exactly 8 rows fit, so there is no half-row to fade. Keep this shallow —
       it hints that the list continues without dimming row 8. */
    position: absolute; left: 0; right: var(--s3); bottom: 34px; height: 22px;
    pointer-events: none; opacity: 0; transition: opacity 220ms var(--ease-out);
    background: linear-gradient(to top, var(--cream) 20%, rgba(247, 240, 222, 0));
  }
  .board-col[data-more="1"]::after { opacity: 1; }

  /* "Showing 1–8 of 15" + position pips */
  .board-foot {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    font-weight: 900; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--navy-soft); opacity: 0.85; min-height: 22px;
  }
  .pips { display: flex; gap: 6px; }
  .pips i {
    width: 22px; height: 5px; border-radius: 99px; background: rgba(27,58,107,.18);
    transition: background-color 220ms var(--ease-out), transform 220ms var(--spring);
  }
  .pips i.on { background: var(--green); transform: scaleY(1.6); }

  .row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--s3);
    background: var(--paper);
    border: 2px solid rgba(27, 58, 107, 0.10);
    border-left: 7px solid var(--accent, var(--green));
    border-radius: var(--r-md);
    padding: var(--s3) var(--s4);
    box-shadow: var(--lift-1);
    transition: transform 260ms var(--spring), box-shadow 260ms var(--ease-out);
    will-change: transform;
  }
  .row.hit { animation: bump 400ms var(--spring); }

  /* rank badge — the poster's numbered circle */
  .rank {
    display: grid; place-items: center;
    width: clamp(40px, 3.2vw, 54px); aspect-ratio: 1;
    border-radius: 50%;
    background: var(--accent, var(--green));
    color: #fff;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(18px, 1.6vw, 26px);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
  }
  .name {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(19px, 1.7vw, 30px);
    letter-spacing: -0.01em; color: var(--navy);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .soup {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: var(--s2); vertical-align: 1px;
    box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px rgba(27,58,107,.18);
  }
  .pts {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(28px, 2.7vw, 48px); line-height: 1;
    color: var(--navy); font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }

  /* every tied leader gets the gold treatment — no arbitrary tiebreak */
  .row.leader {
    --accent: var(--gold);
    background: linear-gradient(168deg, #fffdf3, #fdf3d0);
    border-color: rgba(245, 197, 24, 0.55);
    box-shadow: var(--lift-gold);
    transform: translateY(-2px);
  }
  .row.leader .rank { background: var(--gold); color: var(--navy-ink); }
  .row.leader .name { color: var(--navy-ink); }
  .row.leader .crown {
    width: clamp(20px, 1.7vw, 30px); height: clamp(20px, 1.7vw, 30px);
    display: inline-block; vertical-align: -0.22em; margin-right: var(--s2);
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: var(--s8) var(--s5);
    color: var(--navy-soft); opacity: 0.6; font-weight: 700; font-size: 18px;
  }

  /* --- winner reveal overlay ------------------------------------------- */
  .reveal {
    position: fixed; inset: 0; z-index: 60;
    display: grid; place-items: center;
    padding: var(--s7);
    background: radial-gradient(circle at 50% 42%, rgba(27, 58, 107, 0.975), rgba(9, 22, 44, 0.995));
    animation: fadeIn 420ms var(--ease-out);
  }
  .reveal[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .reveal-card {
    text-align: center;
    max-width: min(1000px, 92vw);
    max-height: 92vh;
    display: grid; gap: var(--s4); justify-items: center;
    animation: popIn 560ms var(--spring);
  }
  @keyframes popIn { from { transform: scale(0.86) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Congratulations and the eyebrow read as one unit, so the gap between them
     is pulled in tighter than the card's default spacing. */
  .reveal .congrats {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(26px, 3vw, 52px); line-height: 1;
    letter-spacing: -0.01em; text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    margin-bottom: calc(var(--s4) * -1 + 2px);
  }
  .reveal .eyebrow {
    font-weight: 900; letter-spacing: 0.28em; font-size: clamp(12px, 1.1vw, 17px);
    text-transform: uppercase; color: var(--gold); opacity: 0.85;
    display: flex; align-items: center; justify-content: center; gap: var(--s3);
  }
  .reveal .pop { width: 1.9em; height: 1.9em; display: block; flex: none; }
  .reveal .pop.flip { transform: scaleX(-1); }
  .reveal h2 {
    font-size: clamp(38px, 5vw, 82px); font-weight: 800; color: #fff;
    line-height: 1.02; letter-spacing: -0.035em;
    text-shadow: 0 5px 0 rgba(0,0,0,.18);
  }
  .reveal .tie-note {
    font-weight: 800; color: var(--gold); font-size: clamp(14px, 1.3vw, 21px);
    letter-spacing: 0.04em;
  }
  .reveal .final-pot { width: min(440px, 44vh); filter: drop-shadow(0 24px 50px rgba(0,0,0,.5)); }
  .reveal .score-line {
    font-family: var(--font-display); font-weight: 800; color: #fff;
    font-size: clamp(24px, 2.4vw, 42px);
  }
  .reveal .score-line b { color: var(--gold); }

  .spark { position: absolute; font-size: 26px; animation: twinkle 1.9s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(14deg); } }

  /* --- bottom values bar, like the poster ------------------------------- */
  .valuebar {
    display: flex; align-items: center; justify-content: center; gap: var(--s7);
    font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase;
    font-size: clamp(11px, 0.86vw, 14px);
    color: #fff;
  }
  .valuebar span { display: inline-flex; align-items: center; gap: var(--s2); }

  /* Narrow screens (a laptop preview, not the projector): stack the pot above
     the board. The pot keeps its floating badges, just at a smaller scale. */
  @media (max-width: 1100px) {
    .split { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 38vh) 1fr; }
    .pot-art { max-width: min(100%, 560px); margin-bottom: -6%; }
    .totals { min-width: 0; padding: var(--s2) var(--s4) var(--s3); }
    .totals .value { font-size: clamp(36px, 7vw, 60px); }
  }
</style>
</head>
<body class="grain">

<!-- decorative -->
<svg class="leaf leaf-tr" viewBox="0 0 200 200" aria-hidden="true">
  <g fill="none" stroke="#4a9b4e" stroke-width="3" opacity="0.55">
    <path d="M100 190C100 120 60 60 12 26" />
    <path d="M100 190C100 120 140 60 188 26" />
  </g>
  <g fill="#4a9b4e" opacity="0.30">
    <path d="M100 178C88 130 62 92 22 62c4 52 34 96 78 116z" />
    <path d="M100 178c12-48 38-86 78-116-4 52-34 96-78 116z" />
  </g>
</svg>
<svg class="leaf leaf-bl" viewBox="0 0 200 200" aria-hidden="true">
  <g fill="#4a9b4e" opacity="0.26">
    <path d="M100 178C88 130 62 92 22 62c4 52 34 96 78 116z" />
    <path d="M100 178c12-48 38-86 78-116-4 52-34 96-78 116z" />
  </g>
</svg>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<main class="stage">

  <header class="masthead">
    <a class="ribbon" style="max-width: 860px" aria-hidden="true">
      <!-- painted ribbon: irregular top/bottom edges, not a plain rectangle -->
      <svg viewBox="0 0 860 108" preserveAspectRatio="none">
        <path fill="#1b3a6b" d="M6 20C150 6 320 14 470 9c150-5 290 3 384 12 6 1 8 8 5 14-4 8-4 40 0 52 3 8-1 15-8 16-120 12-300 2-448 7-148 5-290-2-396-11-7-1-11-8-8-15 5-13 5-42 1-53-2-6 1-11 6-11z"/>
      </svg>
      <div class="ribbon-label" style="flex-direction: column; gap: 2px;">

<script type="module">
import { connectLive } from '/api.js';
import { injectSprites, spriteSvg, spriteHref, iconSvg } from '/sprites.js';

injectSprites();

const $ = (id) => document.getElementById(id);
const board = $('board'), basin = $('basin');
const SOUP_COLORS = { tomato: '#E8547A', mala: '#D4442A', herbal: '#4A9B4E', laksa: '#F5821F' };

/* Broth palettes built around the brand soup-base tokens. Rendered as a
   gradient rather than a flat fill so it reads as liquid, and the rim is
   darkened to match so the broth looks like it sits IN the bowl. */
/* The bowl is terracotta, so a broth in the same red-brown family disappears
   into it. Each palette is pushed lighter and more saturated than the clay,
   with a dark rim ring separating liquid from bowl. */
const BROTH = {
  tomato: { light: '#FF7E96', deep: '#D23A60', rim: '#8E2440', drop: 'rgba(255,225,232,.95)', steam: 'rgba(210,58,96,.28)' },
  mala:   { light: '#E8503A', deep: '#9E1C0C', rim: '#6B1206', drop: 'rgba(255,220,205,.95)', steam: 'rgba(158,28,12,.30)' },
  herbal: { light: '#9FD47F', deep: '#46914A', rim: '#255228', drop: 'rgba(238,250,230,.95)', steam: 'rgba(70,145,74,.28)' },
  laksa:  { light: '#FFD08C', deep: '#EE8B24', rim: '#8E4008', drop: 'rgba(255,238,215,.95)', steam: 'rgba(238,139,36,.30)' },
  none:   { light: '#F0B183', deep: '#D08348', rim: '#8E3418', drop: 'rgba(255,245,230,.95)', steam: 'rgba(27,58,107,.16)' },
};

const potArt = document.querySelector('.pot-art');

// The pot belongs to whoever is at the booth, so the broth follows the ACTIVE
// team's soup base. Set on the admin's tap, so it fills in the moment they
// choose — no toss needed.
function setBroth(base) {
  const b = BROTH[base] ?? BROTH.none;
  potArt.style.setProperty('--broth-light', b.light);
  potArt.style.setProperty('--broth-deep', b.deep);
  potArt.style.setProperty('--droplet', b.drop);
  potArt.style.setProperty('--steam', b.steam);
  potArt.querySelector('.broth-rim')?.setAttribute('stroke', b.rim);
  if (base && BROTH[base]) potArt.dataset.soup = base; else delete potArt.dataset.soup;
}
const ROW_ACCENTS = ['#4A9B4E', '#4FA8D8', '#F5821F', '#8B5FBF', '#E8547A', '#1B3A6B'];

let lastPotSprites = [];   // sprite keys currently in the pot, for the winner reveal
let firstPaint = true;

/* ---------- decorative confetti, scattered once ---------- */
(function confetti() {
  const host = $('confetti');
  const colors = ['#F5C518', '#E8547A', '#8B5FBF', '#4FA8D8', '#F5821F', '#4A9B4E'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    const w = 5 + Math.random() * 8;
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;
      width:${w}px;height:${w * (0.3 + Math.random() * 0.5)}px;
      background:${colors[i % colors.length]};--rot:${Math.random() * 360}deg;
      animation-delay:${(Math.random() * 4).toFixed(2)}s`;
    host.appendChild(s);
  }
})();

/* ---------- pot rendering ---------- */
// Ingredients settle into a rough pile: wide at the base, narrowing upward.
// Ingredients float ON the broth surface, which is an ellipse seen at an
// angle — so rows narrow as they recede, and later rows sit further "back".
function potPosition(i) {
  const perRow = 5;
  const row = Math.floor(i / perRow);
  const col = i % perRow;
  const jitterX = ((i * 37) % 13) - 6;
  const jitterY = ((i * 53) % 7) - 3;
  const inset = 2 + row * 7;          // perspective: back rows are narrower
  const left = inset + (col + 0.5) * ((100 - inset * 2) / perRow) + jitterX;
  const bottom = 4 + row * 17 + jitterY;
  return { left, bottom, tilt: ((i * 29) % 34) - 17 };
}

// Ingredients are ~2x bigger now, so far fewer fit before the pile turns to
// mush. The API still returns 40; we simply draw the most recent slice. Keeping
// that decision here rather than in the contract leaves headroom to change it.
const POT_DRAW = 18;

// The pot arrives already scoped to the team at the booth (see store.js), so a
// team that has not tossed yet gets an EMPTY pot that fills as they play rather
// than inheriting the previous team's ingredients. No filtering needed here —
// doing it twice risks the two disagreeing and blanking the pot.
function renderPot(potAll, animateId) {
  const pot = potAll.slice(-POT_DRAW);
  const seen = new Set(pot.map((p) => p.event_id));

  // drop anything undone, or aged out of the drawn window
  for (const el of [...basin.querySelectorAll('.bit')]) {
    if (!seen.has(el.dataset.eid)) el.remove();
  }

  pot.forEach((p, i) => {
    let el = basin.querySelector(`.bit[data-eid="${CSS.escape(p.event_id)}"]`);
    const isNew = !el;
    if (isNew) {
      el = document.createElement('div');
      el.className = 'bit';
      el.dataset.eid = p.event_id;
      basin.appendChild(el);
    }
    // The admin can correct a logged toss to a different ingredient. That keeps
    // the same event id, so redraw the artwork when the sprite has changed —
    // otherwise the pot would keep showing what was tapped by mistake.
    if (isNew || el.dataset.sprite !== p.sprite) {
      el.dataset.sprite = p.sprite;
      el.title = p.name;
      el.innerHTML =
        `<div class="bit-arc"><div class="bit-spin">${spriteSvg(p.sprite)}</div></div>`;
    }

    // Position MUST be applied before toss(): spawnSplash() copies this
    // element's left/bottom to place the ripple. Tossing first left those
    // empty and dropped every splash at the basin's origin.
    const { left, bottom, tilt } = potPosition(i);
    el.style.setProperty('--tilt', `${tilt}deg`);
    el.style.left = `${left}%`;
    el.style.bottom = `${bottom}%`;

    if (isNew && p.event_id === animateId) toss(el, p);
  });
}

/* One throw. Start point, arc height and spin are derived from the event id so
   several tosses in quick succession look like separate hands, not clones. */
function toss(el, p) {
  const n = [...String(p.event_id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  el.style.setProperty('--from-x', `${-(240 + (n % 130))}px`);
  el.style.setProperty('--from-y', `${60 + (n % 40)}px`);
  el.style.setProperty('--peak', `${-(215 + (n % 90))}px`);   // high trajectory
  el.style.setProperty('--spin-from', `${-(420 + (n % 260))}deg`);
  el.classList.add('tossing');
  // Deterministic cleanup. animationend is not delivered reliably when the tab
  // is backgrounded or not compositing, which would strand the class and stop
  // that ingredient ever animating again.
  setTimeout(() => el.classList.remove('tossing'), 440);
  spawnSplash(el);
}

function spawnSplash(el) {
  const s = document.createElement('div');
  s.className = 'splash';
  s.style.left = el.style.left;
  s.style.bottom = el.style.bottom;
  s.innerHTML = '<span class="ring"></span>' +
    [[-34, -20], [30, -24], [-14, -30], [18, -16]]
      .map(([dx, dy]) => `<i style="--dx:${dx}px;--dy:${dy}px"></i>`).join('');
  basin.appendChild(s);
  setTimeout(() => s.remove(), 460);
}

/* ---------- leaderboard ---------- */
function renderBoard(entries, hitId) {
  const keepScroll = board.scrollTop;

  if (!entries.length) {
    board.innerHTML = '<div class="empty">No departments yet — add one on the admin screen.</div>';
    deptCount = 0;
    updateFoot();
    return;
  }

  board.replaceChildren(...entries.map((d, i) => {
    const row = document.createElement('div');
    row.role = 'listitem';
    row.dataset.id = d.id;
    row.className = 'row' + (d.is_leader ? ' leader' : '');
    row.style.setProperty('--accent', d.is_leader ? 'var(--gold)' : ROW_ACCENTS[i % ROW_ACCENTS.length]);

    const soupDot = d.soup_base
      ? `<span class="soup" style="background:${SOUP_COLORS[d.soup_base] ?? 'var(--navy)'}" title="${d.soup_base} base"></span>`
      : '';

    row.innerHTML = `
      <div class="rank">${d.rank}</div>
      <div class="name">${d.is_leader ? iconSvg('crown', 'crown') : ''}${soupDot}${escapeHtml(d.name)}</div>
      <div class="pts">${d.score}</div>`;

    if (d.id === hitId) row.classList.add('hit');
    return row;
  }));

  // replaceChildren resets scrollTop; restore it so the board does not jump
  // back to the top on every score. This must be 'instant':
  // scroll-behavior:smooth would otherwise animate the restore, and that
  // animation races revealRow() below and can cancel it.
  board.scrollTo({ top: keepScroll, behavior: 'instant' });
  deptCount = entries.length;
  fitRows();
  updateFoot();
}

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- board scrolling ----------
   The board shows VISIBLE_ROWS at a time. It does NOT cycle on its own — the
   view only moves when a department scores, which pulls that row in. The
   footer reports which slice is on screen. */
const VISIBLE_ROWS = 8;

const boardCol = document.querySelector('.board-col');
let deptCount = 0;

// Size rows so exactly VISIBLE_ROWS fill the column height, whatever the screen.
function fitRows() {
  const gap = parseFloat(getComputedStyle(board).rowGap) || 12;
  const h = board.clientHeight;
  if (!h) return;
  const rowH = Math.max(56, (h - gap * (VISIBLE_ROWS - 1)) / VISIBLE_ROWS);
  board.style.setProperty('--row-h', `${rowH}px`);
}
new ResizeObserver(() => { fitRows(); updateFoot(); }).observe(board);

function updateFoot() {
  const gap = parseFloat(getComputedStyle(board).rowGap) || 12;
  const rowH = parseFloat(getComputedStyle(board).getPropertyValue('--row-h')) || 96;
  const pages = Math.max(1, Math.ceil(deptCount / VISIBLE_ROWS));
  const page = Math.min(pages - 1, Math.round(board.scrollTop / ((rowH + gap) * VISIBLE_ROWS)));
  const first = deptCount ? page * VISIBLE_ROWS + 1 : 0;
  const last = Math.min(deptCount, (page + 1) * VISIBLE_ROWS);

  boardCol.dataset.more = board.scrollHeight > board.clientHeight + 4 ? '1' : '0';
  $('boardRange').textContent = deptCount > VISIBLE_ROWS
    ? `Showing ${first}\u2013${last} of ${deptCount}`
    : `${deptCount} department${deptCount === 1 ? '' : 's'}`;

  const pips = $('boardPips');
  if (pips.childElementCount !== (pages > 1 ? pages : 0)) {
    pips.replaceChildren(...Array.from({ length: pages > 1 ? pages : 0 }, () => document.createElement('i')));
  }
  [...pips.children].forEach((el, i) => el.classList.toggle('on', i === page));
}

board.addEventListener('scroll', updateFoot, { passive: true });

// Pull a department into view — used when it scores, so the toss the admin
// just logged is always the one on screen.
function revealRow(id) {
  const el = board.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const before = board.scrollTop;
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  // Smooth scrolling is driven by the compositor, so it never progresses while
  // the tab is not rendering. Snap into place if the animation did not move.
  // The scoring row must be on screen either way.
  setTimeout(() => {
    if (Math.abs(board.scrollTop - before) < 2) {
      el.scrollIntoView({ block: 'nearest', behavior: 'instant' });
    }
    updateFoot();
  }, 420);
}

/* ---------- counters ---------- */
/* Shows the team currently at the booth — NOT the event-wide total.
   `active_department_id` is set by the admin the moment they tap a team, so
   this flips before that team has tossed anything. On a display refresh with
   nothing selected yet we fall back to whoever tossed last, so the card is
   never blank mid-event. */
/* Which team is at the booth. The admin's selection wins; on a display refresh
   with nothing selected yet we fall back to whoever tossed last, so the screen
   is never blank mid-event. The card, the broth colour and the pot contents are
   all driven by this one answer. */
function resolveTeam(entries, activeId, pot) {
  const byActive = activeId ? entries.find((d) => d.id === activeId) : null;
  if (byActive) return byActive;
  if (pot.length) {
    return entries.find((d) => d.id === pot[pot.length - 1].department_id) ?? null;
  }
  return null;
}

function setTeamCard(team, scoredId, delta) {
  const card = $('totals');

  setBroth(team?.soup_base ?? null);

  if (!team) {
    card.dataset.idle = '1';
    card.removeAttribute('data-soup');
    card.style.removeProperty('--soup-tint');
    $('teamName').textContent = 'Waiting for a team';
    return;
  }

  delete card.dataset.idle;
  $('teamName').textContent = team.name;
  $('teamScore').textContent = team.score;
  $('teamTosses').textContent = team.tosses;
  $('teamTossWord').textContent = team.tosses === 1 ? 'ingredient tossed' : 'ingredients tossed';

  if (team.soup_base) {
    card.dataset.soup = team.soup_base;
    card.style.setProperty('--soup-tint', SOUP_COLORS[team.soup_base] ?? 'rgba(74,155,78,.3)');
  } else {
    card.removeAttribute('data-soup');
    card.style.removeProperty('--soup-tint');
  }

  // Only celebrate when THIS team scores — a toss by anyone else must not
  // bump a card showing someone else's number.
  if (scoredId !== team.id) return;
  card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump');
  if (delta > 0) {
    const p = document.createElement('div');
    p.className = 'plus';
    p.textContent = `+${delta}`;
    card.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

/* ---------- winner reveal ---------- */
function renderReveal(entries, announced) {
  const reveal = $('reveal');
  const winners = entries.filter((d) => d.is_leader);
  if (!announced || !winners.length) { reveal.hidden = true; return; }

  $('revealNames').textContent = winners.map((w) => w.name).join(' & ');
  $('revealTie').hidden = winners.length < 2;
  $('revealScore').textContent = winners[0].score;

  // one final pot, for the winner(s) only — not one per department
  const bits = $('finalBits');
  if (!bits.childElementCount) {
    const keys = lastPotSprites.slice(-9);
    (keys.length ? keys : ['broccoli', 'mushroom', 'carrot', 'shrimp-ball', 'fish-tofu'])
      .forEach((key, i) => {
        const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        // Broth surface in this viewBox is cx200 cy152 rx160 ry40 => y 112..192.
        // Rows must sit INSIDE that band, not above the rim.
        const col = i % 3, row = Math.floor(i / 3);
        u.setAttribute('href', spriteHref(key));
        u.setAttribute('x', 72 + col * 84 + ((i * 13) % 16));
        u.setAttribute('y', 104 + row * 23 + ((i * 7) % 9));
        u.setAttribute('width', '76');
        u.setAttribute('height', '76');
        bits.appendChild(u);
      });
  }
  reveal.hidden = false;
}

/* ---------- live wiring ---------- */
const STATUS_TEXT = { live: 'Live', reconnecting: 'Reconnecting…', polling: 'Reconnecting…', offline: 'Offline' };

function apply(payload) {
  const { leaderboard: entries = [], pot = [], announced = false } = payload;
  const ev = payload.last_event;
  const isScore = payload.reason === 'score' && ev;

  const team = resolveTeam(entries, payload.active_department_id ?? null, pot);

  renderBoard(entries, isScore ? ev.department_id : null);
  renderPot(pot, isScore ? ev.id : null);
  lastPotSprites = pot.map((x) => x.sprite);
  setTeamCard(team, !firstPaint && isScore ? ev.department_id : null, isScore ? ev.points_awarded : 0);
  renderReveal(entries, announced);

  // Pull the department that just scored into view. Deferred so it lands after
  // renderBoard's scroll restore. Uses a timer rather than requestAnimationFrame
  // because rAF is paused entirely while a tab is not compositing, which would
  // silently skip the scroll.
  if (isScore) setTimeout(() => revealRow(ev.department_id), 32);

  firstPaint = false;
}

connectLive({
  onState: apply,
  onUpdate: apply,
  onStatus: (s) => {
    $('status').dataset.state = s;
    $('statusText').textContent = STATUS_TEXT[s] ?? s;
  },
});
</script>
</body>
</html>
